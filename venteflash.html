<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vente Flash | GMCrossfit</title>
  <meta name="description" content="Vente flash GMCrossfit — réductions limitées dans le temps.">
  <link rel="icon" href="assets/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var t = localStorage.getItem('gmc_theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div data-site-banner hidden></div>
  <app-header></app-header>

  <section class="flash-hero" data-flash-sale>
    <p class="eyebrow" style="color:#fff;">Offre limitée</p>
    <h1 data-flash-title>Vente Flash</h1>
    <time class="flash-countdown" data-flash-countdown>—</time>
    <p class="muted" data-flash-inactive hidden style="margin-top:1rem;">Aucune vente flash active pour le moment.</p>
  </section>

  <main class="container section">
    <div class="product-grid" data-flash-grid></div>
  </main>

  <app-footer></app-footer>
  <script type="module" src="script.js"></script>
  <script type="module" src="banner.js"></script>
</body>
</html>

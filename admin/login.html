<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | GMCrossfit</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="../assets/logo.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <h1>GMCrossfit</h1>
      <p style="color:var(--muted);margin-top:0;">Administration</p>
      <div data-login-error hidden></div>
      <form class="form-grid" data-login-form style="margin-top:1.5rem;">
        <label>Email <input type="email" name="email" required autocomplete="username"></label>
        <label>Mot de passe <input type="password" name="password" required autocomplete="current-password"></label>
        <button type="submit" class="btn btn-accent">Connexion</button>
      </form>
    </div>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
